<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence Mobile App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
      <div class="container">

        
        <header class="header-content">
           
               <img src="/image/shield.png" alt="">
                <h1>SIGINT OPS</h1>
                <button><div class="point"> </div>SECURE - ONLINE</button>
           
           
        </header>
        <main class="main-container">
            <div class="radar">
                <div class='sweep'></div>

            </div>
            <div class="result">
          
                <h2>24</h2>
                <p>ACTIVES SIGNAL</p>
                <h2>07</h2>
                <P>PRORITY ALERTS</P>

            </div>
           
        </main>
        <section class="under-main">
            <button>⚡ New Brief</button>
            <button> Decode</button>
            <button>✈️  Request Drone</button>
        </section>
        <section class="card-container">
            <div class="card card-1">
                <h2>CRITICAL</h2>
                <p>In Progress</p>
                <h3>OPERATION NIGTHFALL</h3>
                <h4>65%</h4>
                
          
            </div>
            <div class="card card-2">
                 <h2>HIGHT</h2>
                <p>Analysing</p>
                <h3>SIGNAL Intercept</h3>
                <h4>65%</h4>
            </div>

            <div class="card card-3">
                 <h2>MEDIUM</h2>
                <p>Pending</p>
                <h3>OPERATION NIGTHFALL</h3>
                <h4>50%</h4>
            </div>
            <div class="card card-4">
                 <h2>HIGHT</h2>
                <p>In Progress</p>
                <h3>Cyber Defense Grid</h3>
                <h4>80%</h4>
            </div>
            <div class="card-alert">
                <div class="point">
                    
                </div>
                <h2>THREAT DETECTED</h2>
            </div>
        </section>
        <footer>
            <button>Dashboard</button>
            <button>Feed</button>
            <button>Brief</button>
        </footer>

        </div>
    
</body>
</html>
